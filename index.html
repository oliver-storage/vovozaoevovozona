<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1240">
<title>Vovozão e Vovozona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0b1240}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
#menu-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.tela{position:fixed;inset:0;display:none;z-index:1}
.tela.on{display:flex}
/* ---------- abertura ---------- */
#t-abertura{flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(34px + env(safe-area-inset-top)) 16px 16px}
.logo{text-align:center;font-family:'Lilita One',system-ui;line-height:.92;filter:drop-shadow(0 6px 0 rgba(40,10,60,.55)) drop-shadow(0 0 24px rgba(255,200,90,.35))}
.logo .l1,.logo .l3{display:block;font-size:clamp(44px,min(10vw,13vh),92px);letter-spacing:1px}
.logo .l1 span,.logo .l3 span{background:linear-gradient(180deg,#fff7d1 0%,#ffd23f 45%,#f08c1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #7a2a0a;padding:0 1px}
.logo .l2{display:block;font-size:clamp(26px,min(6vw,8vh),54px);color:#ff5fa8;-webkit-text-stroke:2px #fff;margin:2px 0}
.logo span{display:inline-block;animation:pula 1.6s ease-in-out infinite}
@keyframes pula{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sub{margin-top:10px;font-weight:900;font-size:clamp(15px,2.6vw,20px);background:rgba(20,10,50,.55);border:2px solid rgba(255,255,255,.25);padding:6px 16px;border-radius:30px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.menu{margin-top:auto;margin-bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;width:min(340px,86vw);margin-left:auto;margin-right:4vw}
.bt{position:relative;overflow:hidden;font-weight:900;font-size:20px;padding:14px 18px;border-radius:20px;text-align:center;background:linear-gradient(180deg,#ff7eb6,#e0337a);box-shadow:0 6px 0 #8f1d4c,0 10px 20px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.bt.ouro{background:linear-gradient(180deg,#ffe28a,#f2a31b);box-shadow:0 6px 0 #a3610a,0 10px 20px rgba(0,0,0,.35);color:#5a2a00;text-shadow:none;font-size:24px}
.bt.azul{background:linear-gradient(180deg,#7fc8ff,#2e6fde);box-shadow:0 6px 0 #173f8a,0 10px 20px rgba(0,0,0,.35)}
.bt::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:brilho 3s infinite}
@keyframes brilho{0%,60%{left:-60%}100%{left:130%}}
.bt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.cantos{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:3}
.redondo{width:42px;height:42px;border-radius:50%;background:rgba(20,10,50,.55);border:2px solid rgba(255,255,255,.3);font-size:19px;display:flex;align-items:center;justify-content:center}
.redondo.desl{opacity:.45}
.rodape{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:11px;opacity:.7;pointer-events:none;text-shadow:0 1px 2px #000}
@media (orientation:landscape) and (max-height:560px){ #t-abertura{padding-top:8px;align-items:flex-start;padding-left:4vw} .logo{text-align:left} .sub{font-size:14px;margin-top:6px} .menu{position:fixed;right:4vw;top:50%;transform:translateY(-50%);margin:0;width:min(280px,36vw);gap:8px} .bt{padding:9px 12px;font-size:16px} .bt.ouro{font-size:19px} }
@media (orientation:portrait){ .menu{margin-right:auto} }
/* ---------- fases ---------- */
#t-fases{flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px 30px;overflow-y:auto;background:rgba(10,8,40,.45)}
#t-fases h2{font-family:'Lilita One';font-size:36px;color:#ffd23f;-webkit-text-stroke:1.5px #7a2a0a;margin:8px 0 14px}
#lista-fases{display:flex;flex-direction:column;gap:12px;width:min(560px,100%)}
.fase{display:flex;gap:14px;align-items:center;text-align:left;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.3);border-radius:22px;padding:14px;backdrop-filter:blur(6px);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.fase .ic{font-size:44px;width:70px;height:70px;border-radius:18px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fase b{display:block;font-size:19px}
.fase small{display:block;font-size:14px;opacity:.85}
.fase em{display:block;font-style:normal;font-size:13px;color:#ffd23f;margin-top:3px}
.fase.bloq{opacity:.5}
.fase:not(.bloq):active{transform:scale(.98)}
/* ---------- cena ---------- */
#t-cena{background:#000;align-items:center;justify-content:center}
#cena,#tela{display:block;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:#000}
#cena-pular{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;background:rgba(0,0,0,.55);border-radius:16px;padding:8px 16px;font-weight:900}
.cena-dica{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.75;background:rgba(0,0,0,.45);padding:3px 12px;border-radius:12px;pointer-events:none}
.cena-tempo{position:absolute;bottom:8px;left:12%;right:12%;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;pointer-events:none}
.cena-tempo i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5fa8,#ffd23f)}
/* ---------- jogo ---------- */
#t-jogo{flex-direction:column;align-items:center;justify-content:center;background:#05061a}
.palco{position:relative;display:flex;align-items:center;justify-content:center;width:100%;flex:1;min-height:0}
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 0;pointer-events:none;z-index:2}
.hud>*{pointer-events:auto}
.retrato{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:#222;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.retrato canvas{width:100%;height:100%;display:block}
.retrato.on{border-color:#ffd23f;box-shadow:0 0 0 3px rgba(255,210,63,.4),0 3px 8px rgba(0,0,0,.4);transform:scale(1.08)}
.retrato.fora canvas{filter:grayscale(1) brightness(.5)}
.retrato.fora::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.placa{display:flex;align-items:center;gap:10px;background:rgba(10,8,40,.6);border:2px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;font-weight:900;font-size:17px;backdrop-filter:blur(4px)}
#h-letras i{font-style:normal;font-family:'Lilita One';font-size:17px;color:rgba(255,255,255,.25);margin:0 1px}
#h-letras i.on{color:#ffd23f;text-shadow:0 0 8px #ffb000}
.esp{flex:1}
#h-chefe{position:absolute;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(320px,60%);text-align:center;font-weight:900;font-size:13px;z-index:2;pointer-events:none}
.vida-chefe{height:10px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:6px;overflow:hidden;margin-top:3px}
.vida-chefe i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ffb84d);transition:width .3s}
#aviso{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(10,8,40,.8);border:2px solid rgba(255,255,255,.3);padding:7px 16px;border-radius:18px;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:3;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#aviso.on{opacity:1}
.grito{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:'Lilita One';font-size:clamp(26px,6vw,46px);color:#ffd23f;-webkit-text-stroke:2px #7a2a0a;text-shadow:0 5px 0 #7a2a0a;white-space:nowrap;pointer-events:none;z-index:4;animation:grito 1.8s forwards}
@keyframes grito{0%{transform:translate(-50%,-50%) scale(.2)}20%{transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:2}
.ctrl>div{display:grid;gap:8px;pointer-events:auto}
.esqC{grid-template-columns:repeat(3,58px);grid-template-rows:42px 58px;grid-template-areas:". c ." "e b d"}
.dirC{grid-template-columns:repeat(3,62px);grid-template-rows:46px 66px;grid-template-areas:"t s p2" "po pu pu"}
.k{border-radius:18px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);font-size:24px;font-weight:900;line-height:1;backdrop-filter:blur(3px);box-shadow:0 4px 0 rgba(0,0,0,.35);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.k small{font-size:10px;font-weight:900;margin-top:2px}
.k.on{background:rgba(255,210,63,.55);transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#c-esq{grid-area:e}#c-dir{grid-area:d}#c-cima{grid-area:c;font-size:18px}#c-baixo{grid-area:b;font-size:18px}
#c-troca{grid-area:t;font-size:18px}#c-seguir{grid-area:s;font-size:18px}#c-poder2{grid-area:p2;font-size:18px}
#c-poder{grid-area:po;background:rgba(255,140,40,.45)}
#c-pulo{grid-area:pu;background:rgba(60,200,110,.5);font-size:28px}
#c-seguir.desl{background:rgba(255,80,80,.4)}
#c-poder2.apagado{opacity:.35}
@media (orientation:portrait){
  #t-jogo{justify-content:flex-start}
  .palco{flex:0 0 auto;margin-top:calc(60px + env(safe-area-inset-top))}
  .ctrl{position:fixed}
  .esqC{grid-template-columns:repeat(3,64px);grid-template-rows:52px 64px}
  .dirC{grid-template-columns:repeat(3,64px);grid-template-rows:52px 72px}
}
@media (orientation:landscape) and (max-height:520px){ .ctrl{opacity:.8} }
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(8,6,30,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}
.mbox{background:linear-gradient(170deg,#3a2a8a,#1d1452);border:3px solid rgba(255,255,255,.3);border-radius:26px;padding:22px 18px 18px;width:100%;max-width:400px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:entra .35s cubic-bezier(.34,1.5,.64,1);max-height:94dvh;overflow-y:auto}
@keyframes entra{from{transform:scale(.6);opacity:0}}
.mbox h2{font-family:'Lilita One';font-size:30px;color:#ffd23f;-webkit-text-stroke:1px #7a2a0a}
.mbox p{margin-top:6px;line-height:1.4}
.mbox .sub2,.mbox .sub{font-size:14px;opacity:.85;background:none;border:0;padding:0;margin-top:4px}
.btn{display:block;width:100%;padding:13px;border-radius:18px;font-size:18px;font-weight:900;margin-top:10px;background:linear-gradient(180deg,#ff7eb6,#e0337a);box-shadow:0 5px 0 #8f1d4c}
.btn.verde{background:linear-gradient(180deg,#6ee68c,#22b04a);box-shadow:0 5px 0 #17803a}
.btn.sec{background:rgba(255,255,255,.14);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px)}
.res{display:flex;justify-content:space-around;margin-top:12px}
.res b{display:block;font-size:22px}
.res small{opacity:.8;font-size:12px}
</style>
</head>
<body>
<canvas id="menu-bg"></canvas>

<section class="tela on" id="t-abertura">
  <div class="cantos"><button class="redondo" id="b-musica">🎵</button><button class="redondo" id="b-som">🔊</button></div>
  <h1 class="logo">
    <span class="l1"><span>V</span><span style="animation-delay:.1s">O</span><span style="animation-delay:.2s">V</span><span style="animation-delay:.3s">O</span><span style="animation-delay:.4s">Z</span><span style="animation-delay:.5s">Ã</span><span style="animation-delay:.6s">O</span></span>
    <span class="l2">&amp;</span>
    <span class="l3"><span style="animation-delay:.3s">V</span><span style="animation-delay:.4s">O</span><span style="animation-delay:.5s">V</span><span style="animation-delay:.6s">O</span><span style="animation-delay:.7s">Z</span><span style="animation-delay:.8s">O</span><span style="animation-delay:.9s">N</span><span style="animation-delay:1s">A</span></span>
  </h1>
  <p class="sub">🎁 A Grande Missão dos Presentes 🎄</p>
  <div class="menu">
    <button class="bt ouro" id="b-jogar">▶ JOGAR</button>
    <button class="bt azul" id="b-fases">🗺️ Fases</button>
    <button class="bt" id="b-historia">📖 Ver a história</button>
  </div>
  <div class="rodape"></div>
</section>

<section class="tela" id="t-fases">
  <div class="cantos"><button class="redondo" id="b-volta">‹</button></div>
  <h2>Escolha a fase</h2>
  <div id="lista-fases"></div>
  <div class="rodape"></div>
</section>

<section class="tela" id="t-cena">
  <canvas id="cena"></canvas>
  <button id="cena-pular">Pular ›</button>
  <div class="cena-dica">toque para continuar</div>
  <div class="cena-tempo"><i id="cena-barra"></i></div>
</section>

<section class="tela" id="t-jogo">
  <div class="palco"><canvas id="tela"></canvas></div>
  <div class="hud">
    <button class="retrato" id="r-zao"><canvas width="80" height="80"></canvas></button>
    <button class="retrato" id="r-zona"><canvas width="80" height="80"></canvas></button>
    <div class="placa">🎁 <b id="h-pres">0</b> <span id="h-letras"></span></div>
    <div class="esp"></div>
    <div class="placa">❤️ <b id="h-vidas">5</b></div>
    <button class="redondo" id="b-pausa">⏸</button>
  </div>
  <div id="h-chefe" hidden><span id="h-chefe-nome"></span><div class="vida-chefe"><i id="h-chefe-vida"></i></div></div>
  <div id="aviso"></div>
  <div class="ctrl">
    <div class="esqC"><button class="k" id="c-cima">▲</button><button class="k" id="c-esq">◀</button><button class="k" id="c-baixo">▼</button><button class="k" id="c-dir">▶</button></div>
    <div class="dirC"><button class="k" id="c-troca">🔄<small>Trocar</small></button><button class="k" id="c-seguir">🤝<small>Seguir</small></button><button class="k" id="c-poder2">🏋️<small>Lançar</small></button><button class="k" id="c-poder">💪<small>Poder</small></button><button class="k" id="c-pulo">⤒<small>Pular</small></button></div>
  </div>
</section>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script src="arte.js"></script>
<script src="fases.js"></script>
<script src="jogo.js"></script>
</body>
</html>
